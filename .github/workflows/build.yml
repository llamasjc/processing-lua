name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']          # pushing a v* tag publishes a GitHub Release
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# a newer push to the same branch cancels the older run
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ── Java mode JAR ────────────────────────────────────────────────────────
  # The jar is plain bytecode, identical on every OS, so build it once.
  java:
    name: Java
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Cache Processing
        id: cache-processing
        uses: actions/cache@v5
        with:
          path: processing
          key: processing-4.3-linux

      - name: Download Processing (for pde/core jars)
        if: steps.cache-processing.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o processing.tgz \
            https://github.com/processing/processing4/releases/download/processing-1293-4.3/processing-4.3-linux-x64.tgz
          mkdir processing
          tar xzf processing.tgz -C processing --strip-components=1 \
            --wildcards '*/lib/pde.jar' '*/core/library/core.jar'
          rm processing.tgz

      - name: Build native tree-sitter lib (Linux)
        run: native/build.sh lua

      - name: Test + Build mode JAR (no Rust)
        shell: bash
        env:
          SKIP_RUNNER: "1"
          PROCESSING_DIR: ${{ github.workspace }}/processing
          LUAMODE_REQUIRE_NATIVE: "1"   # the parser tests must run here, not skip
        run: gradle test modeJar --no-daemon

      - name: Upload LuaMode.jar
        uses: actions/upload-artifact@v6
        with:
          name: LuaMode-jar
          path: mode/LuaMode.jar

  # ── tree-sitter native lib, one per platform ─────────────────────────────
  # native/build.sh compiles java-tree-sitter + tree-sitter + the Lua grammar
  # into one shared lib. Shipping all four in the jar means nobody installing
  # the mode needs a compiler.
  native:
    name: Native lib (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false      # one platform failing shouldn't hide the others' results
      matrix:
        include:
          - { os: ubuntu-latest,  platform: linux-x86_64,   arch: x86_64 }
          - { os: macos-latest,   platform: macos-aarch64,  arch: aarch64 }
          - { os: macos-latest,   platform: macos-x86_64,   arch: x86_64 }   # cross-built on Apple Silicon
          - { os: windows-latest, platform: windows-x86_64, arch: x86_64 }   # MinGW g++, static runtime

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17 (JNI headers)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Git Bash on Windows needs a POSIX path for JAVA_HOME
          if command -v cygpath >/dev/null; then export JAVA_HOME=$(cygpath -u "$JAVA_HOME"); fi
          native/build.sh lua

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          # the common root is lib/, so the artifact keeps <platform>/<file>
          path: lib/*/*java-tree-sitter*
          if-no-files-found: error

  # ── Rust runner ──────────────────────────────────────────────────────────
  runner:
    name: Runner (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false      # one platform failing shouldn't cancel the others
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@v5

      # runner/Cargo.toml depends on ../../RustMode, i.e. a RustMode checkout
      # next to this repo, the same layout as sketchbook/modes/ locally.
      - name: Check out RustMode engine
        shell: bash
        run: git clone --depth 1 https://github.com/llamasjc/processing-rust.git ../RustMode

      - name: Install X11 headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libx11-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libxi-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('runner/Cargo.toml', 'runner/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Build luamode-runner
        working-directory: runner
        run: cargo build --release --target ${{ matrix.target }}

      # Real sketches in a real window (under a virtual display): drawing,
      # errors, input events, and closing when the IDE goes away.
      - name: Test luamode-runner (Linux)
        if: runner.os == 'Linux'
        working-directory: runner
        env:
          RUNNER: ${{ github.workspace }}/runner/target/${{ matrix.target }}/release/luamode-runner
        run: |
          sudo apt-get install -y -q xvfb xdotool fonts-dejavu-core ffmpeg
          tests/run.sh
          tests/examples.sh
          tests/input.sh
          tests/ide_gone.sh

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: runner-${{ matrix.platform }}
          path: |
            runner/target/${{ matrix.target }}/release/luamode-runner
            runner/target/${{ matrix.target }}/release/luamode-runner.exe

  # ── libprocessing runner (the GPU renderer picked in the toolbar) ────────
  # Built here once per platform so nobody has to compile Bevy themselves.
  runner-libprocessing:
    name: libprocessing runner (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   platform: linux-x86_64 }
          - { os: macos-15-intel, platform: macos-x86_64 }
          - { os: macos-latest,   platform: macos-aarch64 }
          - { os: windows-latest, platform: windows-x86_64 }
    # GLFW on Windows isn't sorted out yet; the others don't wait on it
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    # Bevy is a long build: only for releases (v* tags) and when started by hand
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v5

      - name: Check out RustMode engine
        shell: bash
        run: git clone --depth 1 https://github.com/llamasjc/processing-rust.git ../RustMode

      - name: Rust (RustMode's pinned version)
        shell: bash
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' ../RustMode/rust-toolchain.toml)
          rustup toolchain install "${v:-stable}" --profile minimal
          echo "RUSTUP_TOOLCHAIN=${v:-stable}" >> "$GITHUB_ENV"

      - name: Linux libraries and GLFW 3.4
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxinerama-dev libwayland-dev wayland-protocols libasound2-dev libudev-dev pkg-config cmake
          curl -fsSL https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.zip -o glfw.zip
          unzip -q glfw.zip
          cmake -S glfw-3.4 -B glfw-build -DBUILD_SHARED_LIBS=ON -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF
          sudo cmake --build glfw-build --target install
          sudo ldconfig

      - name: GLFW (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw

      # Downloaded crates and everything compiled last time; when the key
      # doesn't match, the newest older one is used and only the difference compiles
      - name: Restore compiled crates
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            runner/target-libprocessing
          key: lp-${{ matrix.platform }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('runner/Cargo.lock') }}-${{ hashFiles('runner/src/**') }}
          restore-keys: |
            lp-${{ matrix.platform }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('runner/Cargo.lock') }}-
            lp-${{ matrix.platform }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Build
        working-directory: runner
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo build --release --features libprocessing --target-dir target-libprocessing

      # saved even when the build failed, so the next run starts from what got done
      - name: Save compiled crates
        if: always() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            runner/target-libprocessing
          key: lp-${{ matrix.platform }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('runner/Cargo.lock') }}-${{ hashFiles('runner/src/**') }}

      # GLFW 3.4 ships next to the runner, so nobody has to install it
      - name: GLFW next to the runner
        shell: bash
        run: |
          R=runner/target-libprocessing/release
          case "$RUNNER_OS" in
            Linux)   cp -L /usr/local/lib/libglfw.so.3 $R/ ;;
            macOS)   f=$(ls $R/build/glfw-sys-*/out/*/lib-*/libglfw.3.dylib 2>/dev/null | head -1)
                     [ -z "$f" ] && f="$(brew --prefix glfw)/lib/libglfw.3.dylib"
                     cp -L "$f" $R/libglfw.3.dylib ;;
            Windows) f=$(ls $R/build/glfw-sys-*/out/*/lib-vc*/glfw3.dll 2>/dev/null | head -1)
                     [ -n "$f" ] && cp "$f" $R/ || true ;;
          esac
          ls $R | grep -i glfw || true

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: lpr-${{ matrix.platform }}
          path: |
            runner/target-libprocessing/release/luamode-runner
            runner/target-libprocessing/release/luamode-runner.exe
            runner/target-libprocessing/release/libglfw.so.3
            runner/target-libprocessing/release/libglfw.3.dylib
            runner/target-libprocessing/release/glfw3.dll

  # ── Distribution ZIP ─────────────────────────────────────────────────────
  dist:
    name: Distribution ZIP
    needs: [java, native, runner, runner-libprocessing]
    runs-on: ubuntu-latest
    # a libprocessing runner that didn't build leaves that platform on CPU only
    if: >-
      !cancelled() && needs.java.result == 'success' && needs.native.result == 'success' && needs.runner.result == 'success' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Cache Processing
        id: cache-processing-dist
        uses: actions/cache@v5
        with:
          path: processing
          key: processing-4.3-linux

      - name: Download Processing (for pde/core jars)
        if: steps.cache-processing-dist.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o processing.tgz \
            https://github.com/processing/processing4/releases/download/processing-1293-4.3/processing-4.3-linux-x64.tgz
          mkdir processing
          tar xzf processing.tgz -C processing --strip-components=1 \
            --wildcards '*/lib/pde.jar' '*/core/library/core.jar'
          rm processing.tgz

      - name: Download native libs (all platforms)
        uses: actions/download-artifact@v6
        with:
          pattern: native-*
          path: lib/
          merge-multiple: true

      - name: Check every platform's native lib is there
        run: |
          for f in linux-x86_64/libjava-tree-sitter.so macos-aarch64/libjava-tree-sitter.dylib \
                   macos-x86_64/libjava-tree-sitter.dylib windows-x86_64/java-tree-sitter.dll; do
            test -s "lib/$f" || { echo "missing lib/$f"; exit 1; }
            echo "ok lib/$f"
          done

      - name: Download runner binaries
        uses: actions/download-artifact@v6
        with:
          pattern: runner-*
          path: runners/

      - name: Stage runner binaries
        run: |
          mkdir -p mode/runner/linux-x86_64
          mkdir -p mode/runner/macos-x86_64
          mkdir -p mode/runner/macos-aarch64
          mkdir -p mode/runner/windows-x86_64

          cp runners/runner-linux-x86_64/luamode-runner   mode/runner/linux-x86_64/
          cp runners/runner-macos-x86_64/luamode-runner   mode/runner/macos-x86_64/
          cp runners/runner-macos-aarch64/luamode-runner  mode/runner/macos-aarch64/
          cp runners/runner-windows-x86_64/luamode-runner.exe mode/runner/windows-x86_64/

          chmod +x mode/runner/linux-x86_64/luamode-runner
          chmod +x mode/runner/macos-x86_64/luamode-runner
          chmod +x mode/runner/macos-aarch64/luamode-runner

      - name: Download libprocessing runners
        uses: actions/download-artifact@v6
        with:
          pattern: lpr-*
          path: lp-runners/

      - name: Stage libprocessing runners
        shell: bash
        run: |
          for p in linux-x86_64 macos-x86_64 macos-aarch64 windows-x86_64; do
            [ -d "lp-runners/lpr-$p" ] || { echo "no libprocessing runner for $p"; continue; }
            mkdir -p "mode/runner/$p-libprocessing"
            cp lp-runners/lpr-$p/* "mode/runner/$p-libprocessing/"
            chmod +x "mode/runner/$p-libprocessing/luamode-runner" 2>/dev/null || true
          done

      - name: Build distribution ZIP
        env:
          SKIP_RUNNER: "1"
          PROCESSING_DIR: ${{ github.workspace }}/processing
        run: gradle dist --no-daemon

      - name: Upload ZIP
        uses: actions/upload-artifact@v6
        with:
          name: LuaMode-dist
          path: build/distributions/LuaMode.zip

  # ── GitHub Release (on v* tags) ──────────────────────────────────────────
  # The ZIP has the mode jar, all four native libs and all four runners, so
  # users unzip it into sketchbook/modes/ and never compile anything.
  release:
    name: Release
    needs: dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download ZIP
        uses: actions/download-artifact@v6
        with:
          name: LuaMode-dist
          path: dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --title "LuaMode $GITHUB_REF_NAME" --generate-notes
