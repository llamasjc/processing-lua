[package]
name    = "luamode-runner"
version = "0.1.0"
edition = "2021"

# The runner is a thin host: it owns the event loop (via the processing App
# builder) and exposes every Processing function to Lua via mlua.
#
# Build with:
#   cargo build --release
# Copy the resulting binary into LuaMode/mode/runner/<platform>/luamode-runner
# so LuaBuild can locate and invoke it.

[[bin]]
name = "luamode-runner"
path = "src/main.rs"

[dependencies]
# mlua with the Lua 5.4 feature; vendored so the binary is self-contained.
mlua = { version = "0.9", features = ["lua54", "vendored"] }

# The drawing engine is RustMode's `processing` crate (sketchbook/modes/RustMode),
# so Rust and Lua sketches share one renderer. It's imported as `engine`;
# src/processing.rs adapts it to the calls the Lua bindings make.
# regex replace for Table:replaceAll (the engine already depends on it)
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
engine = { package = "processing", path = "../../RustMode" }

[features]
# The libprocessing renderer (Bevy + wgpu). A separate, much bigger build:
#   runner/build-libprocessing.sh  (uses ~/sketchbook/libprocessing when it is there)
# LuaMode uses it when the toolbar's renderer menu says libprocessing.
libprocessing = ["engine/libprocessing"]

# libprocessing's Bevy fork stands in for upstream Bevy (as in libprocessing itself)
[patch."https://github.com/bevyengine/bevy"]
bevy = { git = "https://github.com/processing/bevy", branch = "main" }

[profile.release]
opt-level = 3
strip     = true
